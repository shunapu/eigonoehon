<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8e9">
    <title>Pip and the Little Light | A Little English Story</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="storybook" aria-label="Interactive English picture book">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Pip and the Little Light home">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>A LITTLE ENGLISH STORY</span>
            </a>
            <label class="story-picker">
                <span class="visually-hidden">Choose a story</span>
                <select id="story-select" aria-label="Choose a story">
                    <option value="pip">Pip and the Little Light</option>
                    <option value="seed">Mia and the Tiny Seed</option>
                    <option value="river">Pip and the Little Blue Shell</option>
                </select>
            </label>
            <button class="sound-button" id="read-aloud" type="button" aria-label="Read this page aloud">
                <span aria-hidden="true">🔊</span>
                <span id="read-label">Read to me</span>
            </button>
        </header>

        <section class="book" aria-label="Story">
            <div class="page-art" id="page-art" aria-hidden="true">
                <div class="art-illustration" id="page-illustration"></div>
                <span class="art-ground" aria-hidden="true"></span>
                <span class="art-paper-texture" aria-hidden="true"></span>
            </div>
            <div class="page-copy">
                <p class="page-kicker" id="page-kicker"></p>
                <h1 id="page-title"></h1>
                <div class="story-text" id="story-text" aria-live="polite" aria-atomic="true"></div>
            </div>
        </section>

        <footer class="page-controls">
            <button class="nav-button" id="previous-page" type="button" aria-label="Previous page">
                <span aria-hidden="true">←</span>
                <span>Back</span>
            </button>
            <div class="page-status" aria-live="polite">
                <div class="progress-track" role="progressbar" id="progress" aria-label="Story progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1">
                    <span class="progress-fill" id="progress-fill"></span>
                </div>
                <span id="page-count">1 / 7</span>
            </div>
            <button class="nav-button next-button" id="next-page" type="button" aria-label="Next page">
                <span id="next-label">Next</span>
                <span aria-hidden="true">→</span>
            </button>
        </footer>
        <p class="helper-text">Tap “Read to me” to hear the story.</p>
    </main>
</body>
</html>
